{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center">
                    <h3><i class="fas fa-sign-in-alt me-2"></i>Iniciar Sesión</h3>
                    <p class="mb-0 small">Administradores y Clientes</p>
                </div>
                <div class="card-body">
                    <form method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">
                                <i class="fas fa-user me-1"></i>Usuario
                            </label>
                            <input type="text" name="username" id="username" class="form-control" 
                                   placeholder="Ingresa tu nombre de usuario" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">
                                <i class="fas fa-lock me-1"></i>Contraseña
                            </label>
                            <input type="password" name="password" id="password" class="form-control" 
                                   placeholder="Ingresa tu contraseña" required>
                        </div>
                        <div class="d-grid">
                            <button class="btn btn-primary btn-lg">
                                <i class="fas fa-sign-in-alt me-2"></i>Entrar
                            </button>
                        </div>
                    </form>
                </div>
                <div class="card-footer text-center bg-light">
                    <small class="text-muted">
                        ¿No tienes cuenta? 
                        <a href="{{ url_for('clientes.registrar') }}" class="text-decoration-none">
                            <i class="fas fa-user-plus me-1"></i>Regístrate aquí
                        </a>
                    </small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
