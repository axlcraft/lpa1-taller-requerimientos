{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2>Registrar Cliente</h2>
    <form method="POST">
        <div class="mb-3">
            <label for="nombre_completo" class="form-label">Nombre completo</label>
            <input type="text" name="nombre_completo" id="nombre_completo" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="correo" class="form-label">Correo</label>
            <input type="email" name="correo" id="correo" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="username" class="form-label">Nombre de usuario</label>
            <input type="text" name="username" id="username" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" name="password" id="password" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="telefono" class="form-label">Teléfono</label>
            <input type="text" name="telefono" id="telefono" class="form-control">
        </div>
        <div class="mb-3">
            <label for="direccion" class="form-label">Dirección</label>
            <input type="text" name="direccion" id="direccion" class="form-control">
        </div>
        <button type="submit" class="btn btn-primary">Registrar</button>
    </form>
    <p class="mt-3">¿Ya tienes cuenta? <a href="{{ url_for('auth.login_client') }}">Inicia sesión como cliente</a></p>
    <p class="text-muted small">Nota: solo el superusuario puede editar o eliminar clientes y hoteles desde la interfaz.</p>
</div>
{% endblock %}
