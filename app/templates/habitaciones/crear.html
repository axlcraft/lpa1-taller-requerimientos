{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2>Nueva Habitación</h2>
    <form method="POST">
        <div class="mb-3">
            <label for="hotel_id" class="form-label">Hotel</label>
            <select name="hotel_id" id="hotel_id" class="form-select" required>
                {% for hotel in hoteles %}
                    <option value="{{ hotel.id }}">{{ hotel.nombre }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label for="tipo" class="form-label">Tipo de Habitación</label>
            <select name="tipo" id="tipo" class="form-select" required>
                {% for tipo in tipos %}
                    <option value="{{ tipo.value }}">{{ tipo.value|capitalize }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label for="descripcion" class="form-label">Descripción</label>
            <textarea name="descripcion" id="descripcion" class="form-control"></textarea>
        </div>
        <div class="mb-3">
            <label for="precio_base" class="form-label">Precio Base</label>
            <input type="number" step="0.01" name="precio_base" id="precio_base" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="capacidad" class="form-label">Capacidad</label>
            <input type="number" name="capacidad" id="capacidad" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="servicios_incluidos" class="form-label">Servicios Incluidos</label>
            <textarea name="servicios_incluidos" id="servicios_incluidos" class="form-control" rows="3" 
                      placeholder="Ej: WiFi gratis, Aire acondicionado, TV cable, Minibar, Servicio a la habitación"></textarea>
            <div class="form-text">Separe múltiples servicios con comas</div>
        </div>
        <button type="submit" class="btn btn-primary">Crear Habitación</button>
    </form>
</div>
{% endblock %}
